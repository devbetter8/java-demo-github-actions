# Jenkins local.
# Lancement : docker compose up -d --build (depuis ce dossier)
services:
  jenkins:
    build:
      context: .
      dockerfile: jenkins.Dockerfile
    container_name: jenkins
    restart: unless-stopped
    # Root est nécessaire pour accéder au socket Docker de la machine.
    # Acceptable pour un Jenkins local de TP, à éviter sur un serveur partagé.
    user: root
    ports:
      - "8080:8080"   # Interface web
      - "50000:50000" # Agents Jenkins
    volumes:
      # Conserve la configuration, les jobs et les plugins entre les redémarrages.
      - jenkins_home:/var/jenkins_home
      # Permet à Jenkins de piloter le Docker de la machine (build et lancement de l'application).
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home:
